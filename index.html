
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ErgoBilan</title>
    <style>
      /* Light Theme (Default) */
      :root, body.light-theme {
        --app-bg: #FAF8F4;
        --primary: #E07A5F;
        --secondary: #3D405B;
        --success: #81B29A;
        --warning: #F2CC8F;
        --text-main: #3D405B;
        --text-heading: #1C1C1E;
        --text-secondary: #6B7280;
        --text-light: #9CA3AF;
        --text-disabled: #D1D5DB;
        --card-bg: #FFFFFF;
        --card-bg-raised: #F9F9F9;
        --border-color: #E5E7EB;
        --input-bg: #FFFFFF;
        --input-border: #D1D5DB;
        --hover-bg: #F3F4F6;
        --shadow: rgba(61, 64, 91, 0.08);
        --badge-neutral-bg: #F3F4F6;
        --badge-neutral-text: #374151;
        --btn-secondary-bg: #F3F4F6;
        --btn-secondary-text: #374151;
        --progress-bg: #E5E7EB;
        --modal-overlay: rgba(61, 64, 91, 0.7);
        color-scheme: light;
      }

      /* Dark Theme */
      body.dark-theme {
        --app-bg: #12131F;
        --primary: #E07A5F;
        --secondary: #8B9DC3;
        --success: #81B29A;
        --warning: #F2CC8F;
        --text-main: #C8CFE0;
        --text-heading: #E8EBF4;
        --text-secondary: #8892AA;
        --text-light: #5A6278;
        --text-disabled: #3A4055;
        --card-bg: #1C1E30;
        --card-bg-raised: #242640;
        --border-color: rgba(100, 116, 180, 0.18);
        --input-bg: #242640;
        --input-border: rgba(100, 116, 180, 0.25);
        --hover-bg: #242640;
        --shadow: rgba(0, 0, 0, 0.45);
        --badge-neutral-bg: #1E2038;
        --badge-neutral-text: #C8CFE0;
        --btn-secondary-bg: #1E2038;
        --btn-secondary-text: #C8CFE0;
        --progress-bg: #1E2038;
        --modal-overlay: rgba(12, 13, 25, 0.8);
        color-scheme: dark;
      }
      
      /* Global smooth theme transition */
      *, *::before, *::after {
        transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
      }
      /* Exclude transitions that should remain instant */
      .no-theme-transition, .no-theme-transition * {
        transition: none !important;
      }

      body {
        font-family: 'Quicksand', sans-serif;
        background-color: var(--app-bg);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }
      
      h1, h2, h3, h4, .font-serif {
        font-family: 'Merriweather', serif;
      }

      input, textarea, select {
        font-family: 'Quicksand', sans-serif;
        font-weight: 600;
      }
      
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15);
      }

      /* Utilitaires de transition douce */
      .smooth-transition {
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* Scrollbar invisible mais fonctionnelle pour un look clean */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--input-border); }

      /* --- STYLES WYSIWYG A4 (Item 1) --- */
      
      /* Vue Écran : On simule le papier sur un fond gris */
      /* NOTE: .page-a4 intentionally stays white (print canvas) */
      .page-a4 {
        width: 210mm;
        min-height: 297mm;
        padding: 15mm;
        margin: 10mm auto;
        background: white;
        color: #1C1C1E;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.08);
        position: relative;
        box-sizing: border-box;
        transition: none !important;
      }
      /* PDF viewer panel (wraps .page-a4) gets themed; canvas stays white */
      .pdf-viewer-panel {
        background-color: var(--app-bg);
      }

      /* STYLES D'IMPRESSION */
      @media print {
        @page { margin: 0; size: A4; }
        
        body { 
          background: white; 
          -webkit-print-color-adjust: exact; 
          print-color-adjust: exact; 
        }
        
        body * { visibility: hidden; }
        
        /* On cible le wrapper d'impression */
        #printable-report, #printable-report * { visibility: visible; }
        
        #printable-report { 
          position: absolute; 
          left: 0; 
          top: 0; 
          width: 100%; 
          margin: 0; 
          padding: 0; 
        }

        /* La page A4 devient la référence physique */
        .page-a4 {
          margin: 0;
          box-shadow: none;
          page-break-after: always; /* Force le saut de page après chaque bloc .page-a4 */
          min-height: 297mm; /* Hauteur A4 exacte */
          height: auto;
          width: 100%;
          border: none;
          padding: 15mm; /* Maintient le padding interne */
        }

        /* Masquer les éléments d'interface lors de l'impression */
        .no-print, .no-print * { display: none !important; }
        
        .break-inside-avoid { page-break-inside: avoid; }
      }

      /* PDF EXPORT MODE (applied via body.pdf-mode by html2pdf.js) */
      body.pdf-mode .no-print,
      body.pdf-mode .no-print * { display: none !important; }
      body.pdf-mode .break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
      body.pdf-mode #printable-report { width: 794px !important; }
      body.pdf-mode .page-a4 { box-shadow: none; margin: 0; border: none; }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
